[project]
name = "eval-crash-bench"
version = "0.1.0"
description = "Crash Eval Benchmark"
readme = "README.md"
authors = [
    {name = "UK AI Security Institute"}
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.6",
    "pydantic-extra-types>=2.10.2",
    "pycurl>=7.45.0",
    "inspect_ai>=0.3.79",
    "rich>=13.9",
    "platformdirs>=4.3.7",
    "anthropic>=0.105.2",
    "openai>=2.40.0",
    "inspect-ec2-sandbox",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["tests"]
testpaths = ["tests/**/*.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalcrashbench"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # flake8
  "D",   # pydocstyle
  "I",   # isort
]
ignore = [
  "D212",  # multi-line-summary-first-line
]

[tool.ruff.lint.per-file-ignores]
# Rationale: public objects in the tests and experimental dirs don't form part of the 
# package so drop the requirement for docstrings.
"tests/*" = ["D10"]  # undocumented-(public|magic)-*

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
plugins = "pydantic.mypy"
packages = ["proxmoxsandbox", "tests.proxmoxsandboxtest"]

[tool.uv.sources]
inspect-ec2-sandbox = { git = "https://github.com/UKGovernmentBEIS/inspect_ec2_sandbox.git", branch = "multi-named-sandboxes", lfs = true }

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.9.3",
]
